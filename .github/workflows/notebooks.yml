name: Run notebooks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Execute lecture and case-study notebooks
        run: |
          for nb in 00_getting_started/*.ipynb */lecture.ipynb 06_case_study_alkharj_accidents/*.ipynb; do
            echo "::group::$nb"
            (cd "$(dirname "$nb")" && jupyter nbconvert --to notebook --execute --output /tmp/out.ipynb "$(basename "$nb")")
            echo "::endgroup::"
          done
